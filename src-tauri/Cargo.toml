[package]
name = "photogramme"
version = "0.5.0"
license = "GPL-3.0-or-later"
description = "Film stills, shot detection and color palettes"
authors = ["Arnaud Guillard"]
edition = "2021"

[workspace]
members = ["core"]

[lib]
name = "photogramme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Mises à jour : signature minisign vérifiée avant toute installation.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
photogramme-core = { path = "core" }
# Déjà utilisé par tauri-plugin-shell : attendre et tuer un processus depuis deux fils.
shared_child = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }
